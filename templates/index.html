<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <meta name="description" content="AI Assistant">
    <meta name="theme-color" content="#ffffff">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Markdown & Syntax Highlight -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
        id="hljsTheme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Style -->
    <link rel="stylesheet" href="/static/css/chatgpt.css?v=2.1">

    <!-- ⬇ THEME LOGIC — di <head> agar langsung aktif sebelum body render -->
    <script>
        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme') || 'light';
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            document.body.setAttribute('data-theme', next);
            try { localStorage.setItem('nova_theme', next); } catch (e) { }
        }

        // Terapkan tema tersimpan segera (default light mode persis screenshot ChatGPT)
        (function () {
            try {
                var saved = localStorage.getItem('nova_theme') || 'light';
                document.documentElement.setAttribute('data-theme', saved);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div class="app-container">
        <!-- Overlay mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                    <span>Obrolan baru</span>
                </button>
                <button class="icon-btn close-sidebar-btn" id="closeSidebarBtn" aria-label="Tutup sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Navigasi Menu ChatGPT -->
            <nav class="sidebar-nav">
                <button type="button" class="nav-item" id="navGambar">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <span>Gambar</span>
                    <span class="nav-badge">BETA</span>
                </button>
                <button type="button" class="nav-item" id="navPustaka">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span>Pustaka</span>
                </button>
                <button type="button" class="nav-item" id="navTerjadwal">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Terjadwal</span>
                </button>
                <button type="button" class="nav-item" id="navPlugin">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"></path>
                    </svg>
                    <span>Plugin</span>
                </button>
            </nav>

            <!-- Riwayat Percakapan -->
            <div class="conversations-section">
                <div class="section-title">Riwayat</div>
                <div class="conversations-list" id="conversationsList">
                    <div class="history-skeleton">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
            </div>

            <!-- Status Panel di kiri bawah (indikator online tetap ada!) -->
            <div class="system-status-card">
                <div class="status-row">
                    <div class="status-indicator" id="openRouterIndicator"></div>
                    <span class="status-label">AI Provider</span>
                    <span class="status-val" id="openRouterStatusText">Mengecek...</span>
                </div>
                <div class="status-row">
                    <div class="status-indicator" id="supabaseIndicator"></div>
                    <span class="status-label">Database</span>
                    <span class="status-val" id="supabaseStatusText">Mengecek...</span>
                </div>
            </div>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content is-empty" id="mainContent">
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="nav-left">
                    <button class="icon-btn toggle-sidebar-btn" id="toggleSidebarBtn" aria-label="Buka sidebar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="current-chat-meta">
                        <h1 class="chat-title" id="activeChatTitle"></h1>
                    </div>
                </div>

                <div class="nav-right">
                    <!-- Model Selector — Hanya Antigravity Model -->
                    <div class="model-select-wrap">
                        <label for="modelSelect" class="sr-only">Pilih Model</label>
                        <select id="modelSelect" class="model-dropdown">
                            <option value="ANTIGRAVITY_MODEL">Antigravity Model</option>
                        </select>
                    </div>

                    <!-- Theme Toggle -->
                    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()"
                        title="Ganti Tema" aria-label="Ganti Tema Terang/Gelap">
                        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Area -->
            <div class="chat-container" id="chatContainer">
                <!-- Welcome Screen: TANPA LOGO, TANPA SHORTCUT, HANYA HEADING CHATGPT -->
                <div class="welcome-screen" id="welcomeScreen">
                    <h1 class="welcome-title">Dari mana kita harus mulai?</h1>
                </div>

                <!-- Messages List -->
                <div class="messages-list" id="messagesList"></div>

                <!-- Typing Indicator -->
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-avatar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M12 2v2"></path>
                            <path d="M12 20v2"></path>
                            <path d="m4.93 4.93 1.41 1.41"></path>
                            <path d="m17.66 17.66 1.41 1.41"></path>
                            <path d="M2 12h2"></path>
                            <path d="M20 12h2"></path>
                            <path d="m6.34 17.66-1.41 1.41"></path>
                            <path d="m19.07 4.93-1.41 1.41"></path>
                        </svg>
                    </div>
                    <div class="typing-bubble">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                </div>
            </div>

            <!-- Input Bar: Kapsul persis ChatGPT -->
            <footer class="chat-input-wrapper" id="chatInputWrapper">
                <form class="chat-input-form" id="chatForm">
                    <div class="input-box-container">
                        <button type="button" class="input-action-btn plus-btn" title="Lampirkan file"
                            aria-label="Tambah">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <textarea id="messageInput" class="message-textarea" rows="1" placeholder="Tanyakan apa saja"
                            aria-label="Input pesan"></textarea>
                        <div class="input-actions-right">
                            <button type="button" class="tool-pill-btn" title="Mode Berpikir">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="16" x2="12" y2="12"></line>
                                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                </svg>
                                <span>Berpikir</span>
                            </button>
                            <button type="button" class="input-action-btn attach-btn" title="Alat tambahan"
                                aria-label="Alat">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48">
                                    </path>
                                </svg>
                            </button>
                            <button type="submit" class="send-btn" id="sendBtn" aria-label="Kirim">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.5">
                                    <line x1="12" y1="19" x2="12" y2="5"></line>
                                    <polyline points="5 12 12 5 19 12"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                </form>
                <div class="input-footer-note">AI dapat membuat kesalahan. Selalu verifikasi informasi penting.</div>
            </footer>
        </main>
    </div>

    <script src="/static/js/app-chatgpt.js?v=2.1"></script>
</body>

</html>
